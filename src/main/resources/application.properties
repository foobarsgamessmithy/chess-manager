spring.application.name=chess manager
server.port=8081
# profile is for dev
spring.profiles.active=dev

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/chessmanager

# Logging
logging.level.root=INFO
logging.level.eu.foobarssgamesmithy.chessmanager=INFO
logging.config=classpath:/log/logback.xml
spring.banner.location=classpath:/log/banner.txt